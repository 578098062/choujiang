<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONBin配置测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .input-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>JSONBin配置测试工具</h1>
    
    <div class="input-group">
        <label for="apiKey">API Key:</label>
        <input type="text" id="apiKey" placeholder="输入您的JSONBin API Key">
    </div>
    
    <div class="input-group">
        <label for="binId">Bin ID:</label>
        <input type="text" id="binId" placeholder="输入您的Bin ID">
    </div>
    
    <button onclick="testConfig()">测试配置</button>
    <button onclick="createNewBin()">创建新Bin</button>
    
    <div id="results"></div>

    <script>
        async function testConfig() {
            const apiKey = document.getElementById('apiKey').value;
            const binId = document.getElementById('binId').value;
            const results = document.getElementById('results');
            
            if (!apiKey || !binId) {
                results.innerHTML = '<div class="result error">请填写API Key和Bin ID</div>';
                return;
            }
            
            results.innerHTML = '<div class="result">正在测试...</div>';
            
            try {
                // 测试读取
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: {
                        'X-Master-Key': apiKey
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML = `
                        <div class="result success">
                            <h3>✅ 配置正确！</h3>
                            <p><strong>读取到的数据:</strong></p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const error = await response.text();
                    results.innerHTML = `
                        <div class="result error">
                            <h3>❌ 配置错误</h3>
                            <p>状态码: ${response.status}</p>
                            <p>错误信息: ${error}</p>
                        </div>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="result error">
                        <h3>❌ 测试失败</h3>
                        <p>错误: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function createNewBin() {
            const apiKey = document.getElementById('apiKey').value;
            const results = document.getElementById('results');
            
            if (!apiKey) {
                results.innerHTML = '<div class="result error">请先填写API Key</div>';
                return;
            }
            
            results.innerHTML = '<div class="result">正在创建新Bin...</div>';
            
            try {
                const initialData = {
                    records: [],
                    created_at: new Date().toISOString(),
                    last_updated: new Date().toISOString()
                };
                
                const response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify(initialData)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('binId').value = data.metadata.id;
                    results.innerHTML = `
                        <div class="result success">
                            <h3>✅ Bin创建成功！</h3>
                            <p><strong>Bin ID:</strong> ${data.metadata.id}</p>
                            <p><strong>访问URL:</strong> <a href="https://jsonbin.io/${data.metadata.id}" target="_blank">${data.metadata.id}</a></p>
                            <p>Bin ID已自动填入上方输入框</p>
                        </div>
                    `;
                } else {
                    const error = await response.text();
                    results.innerHTML = `
                        <div class="result error">
                            <h3>❌ 创建失败</h3>
                            <p>状态码: ${response.status}</p>
                            <p>错误信息: ${error}</p>
                        </div>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="result error">
                        <h3>❌ 创建失败</h3>
                        <p>错误: ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
