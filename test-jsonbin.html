<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONBin数据测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .result { background: #d4edda; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 JSONBin数据结构测试</h1>
    
    <button onclick="testDataRead()">测试数据读取和解析</button>
    
    <div id="results"></div>

    <script>
        // 使用您的配置
        const apiKey = '$2a$10$6DvGREHxbTCwbXxvZCl.OelVu2PuxCldw3Lhugi7w7Gogrqpa94i6';
        const binId = '6969b59a43b1c97be933c359';
        const baseURL = 'https://api.jsonbin.io/v3';

        async function testDataRead() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>正在测试数据读取...</p>';
            
            try {
                console.log('开始读取JSONBin数据...');
                const response = await fetch(`${baseURL}/b/${binId}`, {
                    headers: {
                        'X-Master-Key': apiKey
                    }
                });
                
                console.log('响应状态:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('完整数据结构:', data);
                    
                    // 测试不同的解析方式
                    let records = [];
                    if (data.record && data.record.records) {
                        records = data.record.records;
                        console.log('解析方式1 - data.record.records:', records);
                    } else if (data.records) {
                        records = data.records;
                        console.log('解析方式2 - data.records:', records);
                    } else {
                        console.warn('无法解析records:', data);
                    }
                    
                    // 检查张鹏的记录
                    const zhangPengRecord = records.find(r => r.userName === '张鹏');
                    console.log('张鹏的记录:', zhangPengRecord);
                    
                    results.innerHTML = `
                        <div class="result">
                            <h3>✅ 数据读取成功</h3>
                            <p><strong>解析到的记录数量:</strong> ${records.length}</p>
                            <p><strong>找到张鹏的记录:</strong> ${zhangPengRecord ? '是' : '否'}</p>
                            ${zhangPengRecord ? `<p><strong>张鹏的奖品:</strong> ${zhangPengRecord.prize}</p>` : ''}
                            
                            <h4>完整JSON数据结构:</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    results.innerHTML = `
                        <div class="error">
                            <h3>❌ 读取失败</h3>
                            <p>状态码: ${response.status}</p>
                            <p>错误: ${errorText}</p>
                        </div>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="error">
                        <h3>❌ 异常</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                console.error('测试异常:', error);
            }
        }
    </script>
</body>
</html>
